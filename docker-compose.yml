version: "3.9"

services:
  web:
    build: .
    container_name: finania-web
    restart: always
    expose:
      - "5000"
    env_file:
      - .env

  nginx:
    image: nginx:latest
    container_name: finania-nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web